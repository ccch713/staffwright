# Staffwright · one-command deployment (fresh server: docker compose up)
# Usage:
#   cp .env.example .env   and set DDW_ACCESS_TOKEN
#   docker compose -f deepddw-compose.yml up -d --build
# Open: http://<host>:8500/  (launcher → enter token → workbench)
#
# Components: gateway (FastAPI + MCP dual protocol + token gate),
#             knowledge base / memory (SQLite), static UI (/ui),
#             aggregate search (SearXNG sidecar), DSH engine (see comment below)
services:
  ddw-core:
    build: .
    container_name: deepddw-core
    restart: unless-stopped
    environment:
      DDW_ACCESS_TOKEN: ${DDW_ACCESS_TOKEN:?DDW_ACCESS_TOKEN must be set in .env}
      DDW_DEEPSEEK_API_KEY: ${DDW_DEEPSEEK_API_KEY:-}
      SEARXNG_URL: http://searxng:8080
      DDW_ENV: ${DDW_ENV:-development}
      DDW_LOG_LEVEL: ${DDW_LOG_LEVEL:-INFO}
    ports:
      - "8500:8500"
    volumes:
      - ddw_data:/app/data
    depends_on:
      searxng:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8500/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # SearXNG aggregate search (whitelisted component; optional — ddw-core does not require it to be reachable)
  searxng:
    image: searxng/searxng:latest
    container_name: deepddw-searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/

  # DSH engine (DeepSeek Harness, official MIT): launched as a subprocess/sidecar,
  # wired into this gateway via MCP streamable-http (see README).
  # Example (requires npm i -g @deepseek-ai/dsh on the host or a custom image):
  # dsh:
  #   image: node:22-slim
  #   container_name: deepddw-dsh
  #   restart: unless-stopped
  #   command: sh -c "npm i -g @deepseek-ai/dsh && dsh"
  #   ports:
  #     - "3080:3080"

volumes:
  ddw_data:

networks:
  default:
    name: deepddw-net
