<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staffwright · Virtual Office</title>
<!--
  Staffwright Virtual Office (v0.8.0)
  Original programmatic pixel rendering (frontend/assets/virtual-office.js), zero third-party assets.
  Data: GET /api/v1/office/state (token-gated; zero-config on LAN password-free mode).
  view-only: read-only aggregation, no controls; the only text exposed is job titles and whitelisted count phrases.
-->
<style>
  :root{--bg:#050816;--panel:#0d1226;--line:#1c2340;--brand:#7aa2ff;--txt:#c8cfe6;--dim:#6b7392}
  html,body{margin:0;background:var(--bg)}
  .page{max-width:1280px;margin:0 auto;padding:14px}
  .tokenbar{display:none;align-items:center;gap:8px;margin-bottom:10px;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:10px 14px;font:13px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt)}
  .tokenbar input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:7px 10px;color:var(--txt);font-size:13px;outline:none}
  .tokenbar button{background:var(--brand);border:0;color:#0a1030;border-radius:8px;padding:7px 16px;font-size:13px;cursor:pointer;font-weight:600}
  .tokenbar.show{display:flex}
  footer{color:var(--dim);font:12px/1.6 -apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:10px 0 18px}
</style>
</head>
<body>
<div class="page">
  <div class="tokenbar" id="tokenbar">
    <span>Access token:</span>
    <input id="tok" type="password" placeholder="X-DDW-Token (the DDW_ACCESS_TOKEN configured on the server)">
    <button id="toksave">Connect</button>
  </div>
  <div id="office" style="min-height:640px"></div>
  <footer>Staffwright Virtual Office · read-only status mirror (view-only) · this page never exposes document, memory, or chat contents</footer>
</div>
<script src="/ui/assets/virtual-office.js"></script>
<script>
(function () {
  // ===== Fixed roster: ids map 1:1 to the residents in core/api/office.py =====
  // Names stay short on purpose — they are drawn on 9px canvas desk plates.
  var ROSTER = [
    { id: 'gateway', name: 'Al',    role: 'Gateway Doorman',  bio: 'Every device handshake goes through him — miss the 60-second heartbeat and you are off the roster.', palette: { hair: '#c8cfe6', clothes: '#7aa2ff' } },
    { id: 'chat',    name: 'Sam',   role: 'Chat Reception',   bio: 'First stop for every DSH session; messages never sit overnight.', palette: { hair: '#ffb86b', clothes: '#50fa7b' } },
    { id: 'memory',  name: 'Penny', role: 'Memory Butler',    bio: 'Files away everything worth keeping; nothing is forgotten across sessions.', palette: { hair: '#f2c9a0', clothes: '#8e6bd8' } },
    { id: 'kb',      name: 'Bo',    role: 'Librarian',        bio: 'Shelves and catalogs documents; keeps both FTS and vector indexes sharp.', palette: { hair: '#ffd44d', clothes: '#3fb1ff' } },
    { id: 'llm',     name: 'Max',   role: 'Meter Clerk',      bio: 'Books every model call in the ledger; takes failures personally.', palette: { hair: '#8b96a5', clothes: '#ff7b72' } },
    { id: 'distill', name: 'Dee',  role: 'Distiller',        bio: 'Slowly boils scattered experience down into team consensus.', palette: { hair: '#5c7086', clothes: '#7ee2b8' } },
    { id: 'backup',  name: 'Bea',   role: 'Backup Clerk',     bio: 'Night-shift keeper; not a single database snapshot goes missing.', palette: { hair: '#ff9d5c', clothes: '#ffd44d' } },
    { id: 'relay',   name: 'Rae',   role: 'Org Relay',        bio: 'On duty at the bindcode organization backend window.', palette: { hair: '#c8cfe6', clothes: '#50fa7b' } }
  ];

  var TOKEN_KEY = 'ddw_office_token';
  function headers() {
    var t = localStorage.getItem(TOKEN_KEY) || '';
    return t ? { 'X-DDW-Token': t } : {};
  }
  async function pull() {
    var r = await fetch('/api/v1/office/state', { headers: headers(), cache: 'no-store' });
    if (r.status === 401) {
      var bar = document.getElementById('tokenbar');
      bar.classList.add('show');
      throw new Error('need token');
    }
    if (!r.ok) throw new Error('http ' + r.status);
    var j = await r.json();
    // Unwrap the {ok, data} envelope from core.api_response
    var d = j && j.data ? j.data : j;
    // Map API residents to the {id:{state,note,today}} shape the render core expects; digest fields already match
    var rs = {};
    Object.keys(d.residents || {}).forEach(function (k) {
      var v = d.residents[k];
      rs[k] = { state: v.state, note: v.note, today: v.today };
    });
    return { residents: rs, digest: d.digest, banner: d.banner };
  }

  document.getElementById('toksave').addEventListener('click', function () {
    localStorage.setItem(TOKEN_KEY, document.getElementById('tok').value.trim());
    location.reload();
  });

  // ===== Demo script (for README screenshots/videos; writes nothing server-side) =====
  var DEMO = {
    speed: 1, holdAfter: 10,
    script: [
      { t: 0,  set: { gateway: { state: 'idle', note: 'No devices online' }, chat: { state: 'sleeping', note: 'No one has chatted yet today' } } },
      { t: 3,  set: { gateway: { state: 'walking', note: 'New device walking in' } } },
      { t: 8,  set: { gateway: { state: 'working', note: '2 devices online' } } },
      { t: 13, set: { chat: { state: 'working', note: 'Message just arrived' } } },
      { t: 19, set: { memory: { state: 'doc', note: 'Taking notes' } } },
      { t: 25, set: { kb: { state: 'search', note: 'Searching the knowledge base' } } },
      { t: 31, set: { llm: { state: 'working', note: 'Metering calls' } } },
      { t: 37, set: { chat: { state: 'celebrating', note: 'Session delivered' }, memory: { state: 'celebrating', note: 'Memory archived' } } },
      { t: 44, set: { backup: { state: 'celebrating', note: 'Backup complete' } } },
      { t: 50, set: { llm: { state: 'upset', note: '3 calls failed' } }, banner: { level: 'bad', count: 3, text: 'LLM calls failed (last 24h) — check the gateway logs' } },
      { t: 58, set: { llm: { state: 'celebrating', note: 'Gateway recovered' } }, banner: null },
      { t: 64, set: { gateway: { state: 'working', note: '2 devices online' }, chat: { state: 'idle', note: '36 messages today' } } }
    ]
  };

  new VirtualOffice(document.getElementById('office'), {
    title: 'Staffwright Virtual Office',
    subtitle: 'Memory · Knowledge base · Gateway · Devices — every pixel worker is a real Staffwright subsystem',
    roster: ROSTER,
    poll: { fn: pull, interval: 5000 },
    demo: DEMO,
    theme: {
      pageBg: '#050816', panelBg: '#0d1226', panelLine: '#1c2340', bg: '#070b1a',
      floorA: '#0b1020', floorB: '#0d1326', wall: '#141a33', wallTop: '#1c2340',
      accent: '#7aa2ff', headText: '#e8ecfa', textPanel: '#c8cfe6', dim: '#6b7392'
    },
    strings: { offline: 'Staffwright backend offline (not running, or a token is needed)… reconnects automatically' }
  });

  // If no token yet and not on password-free LAN, show the token bar up front
  pull().catch(function () { document.getElementById('tokenbar').classList.add('show'); });
})();
</script>
</body>
</html>
