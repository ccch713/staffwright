<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0f24">
<link rel="manifest" href="/ui/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/ui/assets/logo-ju.svg">
<title>Staffwright Workbench</title>
<style>
:root{
  --bg-base:#050816;--bg-page:#0a0f24;--bg-card:#111a3a;--bg-input:#0d1330;
  --text-primary:#e8ecf8;--text-secondary:#a8b3d0;--text-muted:#6b7899;
  --brand:#00e5ff;--accent-green:#00ff9d;--accent-orange:#ffab40;--accent-purple:#b388ff;
  --border:#233052;--danger:#ff5c5c;
}
/* P2-30: follow system light/dark mode */
@media (prefers-color-scheme: light) {
  :root{
    --bg-base:#f5f7fa;--bg-page:#ffffff;--bg-card:#f0f3f8;--bg-input:#fafbfd;
    --text-primary:#1f2937;--text-secondary:#4b5563;--text-muted:#9ca3af;
    --brand:#0284c7;--accent-green:#059669;--accent-orange:#d97706;--accent-purple:#7c3aed;
    --border:#e5e7eb;--danger:#dc2626;
  }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg-page);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{background:var(--bg-base);border-bottom:1px solid var(--border);padding:14px 16px calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header img{width:26px;height:26px}
header h1{font-size:16px;font-weight:700}
header .badge{margin-left:auto;font-size:11px;color:var(--text-muted);border:1px solid var(--border);padding:3px 10px;border-radius:999px}
main{flex:1;overflow-y:auto;padding:16px;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px}
.card h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
input,textarea{width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:10px;color:var(--text-primary);padding:10px 12px;font-size:14px;outline:none;font-family:inherit}
textarea{min-height:72px;resize:vertical}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;height:42px;border:none;border-radius:10px;background:linear-gradient(135deg,#00e5ff,#0099ff);color:#04121f;font-size:14px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.5}
.btn.ghost{flex:none;width:auto;padding:0 16px;background:transparent;border:1px solid var(--border);color:var(--text-secondary)}
.out{background:var(--bg-input);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:12px;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--text-secondary);min-height:40px}
.item{background:var(--bg-input);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px;line-height:1.6}
.item b{color:var(--brand)}
.item .meta{color:var(--text-muted);font-size:11.5px;margin-top:4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg-base);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;height:54px;background:none;border:none;color:var(--text-muted);font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button .ic{font-size:18px}
nav button.active{color:var(--brand)}
.hidden{display:none}
.msg{font-size:12px;margin-top:8px;min-height:16px}
.msg.err{color:var(--danger)}
</style>
</head>
<body>
<header>
  <img src="/ui/assets/logo-ju.svg" alt="">
  <h1>Staffwright Workbench</h1>
  <span class="badge" id="status">Not connected</span>
</header>

<main>
  <!-- Chat -->
  <section class="panel" id="panel-chat">
    <div class="card">
      <h2>💬 Chat</h2>
      <textarea id="chat-input" placeholder="Type a message, Enter to send"></textarea>
      <div class="row"><button class="btn" id="chat-send">Send</button><button class="btn ghost" id="chat-clear" type="button">Clear</button></div>
      <div class="out" id="chat-out">(If no LLM key is configured, replies fall back to a notice — everything else still works)</div>
    </div>
  </section>

  <!-- Knowledge base -->
  <section class="panel hidden" id="panel-kb">
    <div class="card">
      <h2>📚 Knowledge Search</h2>
      <input id="kb-q" placeholder="Search terms, e.g. deployment">
      <div class="row"><button class="btn" id="kb-search">Search</button></div>
      <div id="kb-out"></div>
    </div>
    <div class="card">
      <h2>➕ New Document</h2>
      <input id="kb-title" placeholder="Title">
      <textarea id="kb-content" placeholder="Content"></textarea>
      <div class="row"><button class="btn" id="kb-add">Add</button><button class="btn ghost" id="kb-add-close" type="button">Hide</button></div>
      <div class="msg" id="kb-msg"></div>
    </div>
  </section>

  <!-- Memory -->
  <section class="panel hidden" id="panel-mem">
    <div class="card">
      <h2>🧠 Save Memory</h2>
      <input id="mem-key" placeholder="key, e.g. preference">
      <textarea id="mem-value" placeholder="What to remember"></textarea>
      <div class="row"><button class="btn" id="mem-put">Save</button></div>
      <div class="msg" id="mem-msg"></div>
    </div>
    <div class="card">
      <h2>🔍 Memory Search</h2>
      <input id="mem-q" placeholder="Search terms">
      <div class="row"><button class="btn" id="mem-search">Search</button></div>
      <div id="mem-out"></div>
    </div>
  </section>

  <!-- Docs -->
  <section class="panel hidden" id="panel-docs">
    <div class="card">
      <h2>📄 Document Search</h2>
      <input id="docs-q" placeholder="Search terms, e.g. deployment">
      <div class="row"><button class="btn" id="docs-search">Search</button></div>
      <div id="docs-out"></div>
    </div>
    <div class="card">
      <h2>🔗 Docs Center</h2>
      <div class="item">Public docs: <a href="/ui/docs/index.html" style="color:var(--brand)">Staffwright documentation</a></div>
    </div>
  </section>
</main>

<nav>
  <button data-panel="chat" class="active"><span class="ic">💬</span>Chat</button>
  <button data-panel="kb"><span class="ic">📚</span>Knowledge</button>
  <button data-panel="mem"><span class="ic">🧠</span>Memory</button>
  <button data-panel="docs"><span class="ic">📄</span>Docs</button>
</nav>

<script>
(function () {
  "use strict";
  var token = null;
  try { token = sessionStorage.getItem("deepddw_token"); } catch (e) {}
  // Launcher iframe postMessage channel (cross-origin, never via URL).
  // P2-23: validate ev.origin — accept only the launcher's origin (same-origin or
  // the Staffwright gateway origin), so an arbitrary iframe cannot inject a token.
  var ALLOWED_ORIGINS = (function () {
    try {
      var launcher = localStorage.getItem("deepddw_addr");
      if (launcher) return [launcher, window.location.origin];
    } catch (e) {}
    return [window.location.origin];
  })();
  window.addEventListener("message", function (ev) {
    if (ev.data && ev.data.type === "deepddw-token" && ev.data.token) {
      if (ALLOWED_ORIGINS.indexOf(ev.origin) === -1) return;  // reject unknown origins
      token = ev.data.token;
      setStatus("Connected");
      try { sessionStorage.setItem("deepddw_token", token); } catch (e) {}
    }
  });
  var statusEl = document.getElementById("status");
  function setStatus(s) { statusEl.textContent = s; }
  // LAN password-free mode: usable without a token (the server auto-allows LAN
  // requests); the badge then reads "LAN mode".
  if (token) setStatus("Connected");
  else if (window.location.protocol === "http:" || window.location.protocol === "https:") {
    // Same-origin / LAN default is password-free; probe once, mark LAN mode on success
    fetch("/api/v1/gateway/verify", { headers: headers() })
      .then(function (r) { if (r.ok) { setStatus("LAN mode"); window.__lanFree = true; } else { setStatus("Token needed"); } })
      .catch(function () { setStatus("Token needed"); });
  } else {
    setStatus("Token needed");
  }

  function headers() {
    var h = { "Content-Type": "application/json" };
    if (token) h["X-DDW-Token"] = token;
    return h;
  }
  function out(id, text) {
    var el = document.getElementById(id);
    el.textContent = text;
  }
  function appendItems(id, items, fmt) {
    var el = document.getElementById(id);
    el.innerHTML = "";
    items.forEach(function (it) {
      var d = document.createElement("div");
      d.className = "item";
      d.innerHTML = fmt(it);
      el.appendChild(d);
    });
  }

  // ---- panel switching ----
  document.querySelectorAll("nav button").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll("nav button").forEach(function (x) { x.classList.remove("active"); });
      b.classList.add("active");
      document.querySelectorAll(".panel").forEach(function (p) { p.classList.add("hidden"); });
      document.getElementById("panel-" + b.dataset.panel).classList.remove("hidden");
    });
  });

  // ---- chat ----
  var chatInput = document.getElementById("chat-input");
  function sendChat() {
    var message = chatInput.value.trim();
    if (!message) return;
    // LAN password-free mode: send without a token (server auto-allows LAN);
    // from outside the LAN without a token the server answers 401 — prompt then.
    out("chat-out", "Thinking…");
    fetch("/api/v1/chat/", {
      method: "POST", headers: headers(),
      body: JSON.stringify({ message: message }),
    }).then(function (r) {
      return r.json().then(function (d) {
        if (r.status === 401) {
          out("chat-out", "Unauthorized: enter your access token first (required from outside the LAN)");
          return null;
        }
        return d;
      });
    }).then(function (d) {
      if (!d) return;
      var data = d.data || d;
      var content = (data.content || JSON.stringify(d)) || "";
      // P2-24: strip only the "[deepDDW] " notice prefix itself, keep the text after it
      content = content.replace(/^\[deepDDW\]\s*/gm, "");
      content = content.replace(/^\[llm-router\]\s*/gm, "");
      out("chat-out", content.trim() || "(empty reply)");
    }).catch(function (e) { out("chat-out", "Request failed: " + e.message); });
  }
  document.getElementById("chat-send").addEventListener("click", sendChat);
  // P3-10/P2-30: clear the current conversation (frontend state only; DB history is kept)
  document.getElementById("chat-clear").addEventListener("click", function () {
    out("chat-out", "");
    chatInput.value = "";
  });
  chatInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });

  // ---- knowledge base ----
  document.getElementById("kb-search").addEventListener("click", function () {
    var q = document.getElementById("kb-q").value.trim();
    if (!q) return;
    fetch("/api/v1/knowledge/search?q=" + encodeURIComponent(q) + "&top_k=5", { headers: headers() })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var items = (d.data && d.data.results) || [];
        if (!items.length) { document.getElementById("kb-out").innerHTML = '<div class="item">No matches</div>'; return; }
        appendItems("kb-out", items, function (it) {
          return "<b>" + esc(it.title) + "</b><div class='meta'>" + esc(it.excerpt) + "</div>";
        });
      }).catch(function (e) { document.getElementById("kb-out").innerHTML = '<div class="item">Failed: ' + esc(e.message) + "</div>"; });
  });
  document.getElementById("kb-add").addEventListener("click", function () {
    var title = document.getElementById("kb-title").value.trim();
    var content = document.getElementById("kb-content").value.trim();
    if (!title || !content) { document.getElementById("kb-msg").textContent = "Title and content are required"; return; }
    fetch("/api/v1/knowledge/documents", {
      method: "POST", headers: headers(),
      body: JSON.stringify({ title: title, content: content }),
    }).then(function (r) { return r.json(); }).then(function (d) {
      document.getElementById("kb-msg").textContent = "Added, id=" + (d.data && d.data.id);
      document.getElementById("kb-content").value = "";
    }).catch(function (e) { document.getElementById("kb-msg").textContent = "Failed: " + e.message; });
  });

  // ---- memory ----
  document.getElementById("mem-put").addEventListener("click", function () {
    var key = document.getElementById("mem-key").value.trim();
    var value = document.getElementById("mem-value").value.trim();
    if (!key || !value) { document.getElementById("mem-msg").textContent = "Key and value are required"; return; }
    fetch("/api/v1/memory/put", {
      method: "POST", headers: headers(),
      body: JSON.stringify({ key: key, value: value }),
    }).then(function (r) { return r.json(); }).then(function (d) {
      document.getElementById("mem-msg").textContent = "Saved (id=" + (d.data && d.data.id) + ")";
      document.getElementById("mem-value").value = "";
    }).catch(function (e) { document.getElementById("mem-msg").textContent = "Failed: " + e.message; });
  });
  document.getElementById("mem-search").addEventListener("click", function () {
    var q = document.getElementById("mem-q").value.trim();
    if (!q) return;
    fetch("/api/v1/memory/search?q=" + encodeURIComponent(q) + "&top_k=5", { headers: headers() })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var items = (d.data && d.data.results) || [];
        if (!items.length) { document.getElementById("mem-out").innerHTML = '<div class="item">No matches</div>'; return; }
        appendItems("mem-out", items, function (it) {
          return "<b>[" + esc(it.key) + "]</b> " + esc(it.value) + "<div class='meta'>" + (it.tags || []).join(", ") + "</div>";
        });
      }).catch(function (e) { document.getElementById("mem-out").innerHTML = '<div class="item">Failed: ' + esc(e.message) + "</div>"; });
  });

  // ---- docs ----
  document.getElementById("docs-search").addEventListener("click", function () {
    var q = document.getElementById("docs-q").value.trim();
    if (!q) return;
    fetch("/api/v1/plugins/ddw-docs-portal/search?q=" + encodeURIComponent(q) + "&top_k=5", { headers: headers() })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var sources = d.sources || [];
        if (!sources.length) { document.getElementById("docs-out").innerHTML = '<div class="item">No matches</div>'; return; }
        appendItems("docs-out", sources, function (it) {
          return "<b>" + esc(it.title) + "</b> (" + esc(it.version) + ")<div class='meta'>" + esc(it.excerpt || "") + "</div>";
        });
      }).catch(function (e) { document.getElementById("docs-out").innerHTML = '<div class="item">Failed: ' + esc(e.message) + "</div>"; });
  });

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
})();
</script>
</body>
</html>
